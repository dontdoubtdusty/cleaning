<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Big Shiny</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3f8ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1622" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Shiny"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Theme ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;--bg:#f3f8ff;--card:#fff;--fld:#e9f2fd;--tx:#13263b;--mu:#6b8098;--ac:#1593c9;--bd:#dce9f7;--neg:#e5484d;--wn:#f08c00;--pc:#2f8fff;--pc2:#5ec4ff;--brand:#2f8fff;--gl:12%;--tst:#13263b;--sh:0 1px 2px rgba(20,60,110,.05),0 10px 24px -14px rgba(20,60,110,.22);--fast:.16s;--fd:'Fredoka','Nunito',system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1622;--card:#142130;--fld:#1c2c3e;--tx:#eaf3ff;--mu:#93a8c0;--ac:#5cc4f0;--bd:#24364a;--neg:#ff6b70;--wn:#ffb020;--sh:0 10px 24px -16px rgba(0,0,0,.7);--gl:20%;--tst:#24364a}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh)}

/* ===== Base ===== */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 440px at 50% -140px,color-mix(in srgb,var(--pc) var(--gl),transparent),transparent 72%) no-repeat,var(--bg);color:var(--tx);font:500 15px/1.45 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}input,select,button,b{font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:12px}
.vclip{overflow:hidden;width:100%}
.view{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;touch-action:pan-y}
.view>.seg,.view>h2,.view>button,.view>p,.view>.tiles,.view>.wide,.view>.warn,.view>.pcb,.view>.flh{grid-column:1/-1}
.view>h2{margin:8px 2px 0}
h2,h3{margin:0 0 10px;font-family:var(--fd);font-weight:600}h2{font-size:20px;letter-spacing:-.2px}h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--neg)}.pos{color:var(--ac)}
.sec{display:block;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);margin:2px 0 6px}
.ic{display:inline-block;vertical-align:-2px}

/* ===== Cards & rows ===== */
.card,.tile{border-radius:22px;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);padding:16px}
.view>.card{background-image:linear-gradient(90deg,var(--pc),var(--pc2));background-size:100% 5px;background-repeat:no-repeat;background-origin:border-box;padding-top:19px}.card h2{color:var(--pc)}
.row{display:flex;gap:8px;align-items:center;margin:2px 0;min-height:38px}.row>*{min-width:0}.row>.mu{flex:none}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln b{font-weight:600;white-space:nowrap}
.tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);border-radius:99px;padding:3px 8px;text-transform:uppercase}
.tag.low{color:var(--neg);background:color-mix(in srgb,var(--neg) 13%,transparent)}
.bar{height:8px;background:var(--fld);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pc),var(--pc2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.warn{border-color:var(--wn);background:color-mix(in srgb,var(--wn) 9%,var(--card))}.warn h3{color:var(--wn)}.warn .row button{padding:5px 12px;font-size:13px}
.bang{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:6px;border-radius:50%;background:var(--wn);color:#fff;font-weight:800;font-size:12px;line-height:1}

/* ===== Inputs & buttons ===== */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],textarea,select{width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:var(--fld);color:var(--tx);font:inherit;transition:border-color var(--fast),background var(--fast)}
.row input[type=text],.row input[type=number],.row input[type=date],.row select{padding:7px 8px}
input[type=number]{width:80px;flex:none;text-align:right;-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
select.f{width:auto;flex:none;max-width:118px}
textarea{height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 18%,transparent)}
.ed input[type=text]{background:transparent}@media(hover:hover){.ed input[type=text]:hover{background:var(--fld)}}.ed input[type=text]:focus{background:var(--card)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:26px;height:26px;flex:none;margin:0;border:2px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:9px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;transition:background var(--fast),border-color var(--fast)}
input[type=checkbox]::after{content:"";width:6px;height:11px;margin-top:-3px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent}input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox].pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.22)}}
button{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent);transition:transform .25s var(--bounce),filter .1s,background var(--fast)}
button.g{background:none;color:var(--mu);padding:8px 10px;font-weight:600}button.x{background:none;color:var(--neg);padding:8px 8px;font-weight:600}
button.bd{border:1px solid var(--bd);color:var(--tx)}button.x.bd{color:var(--neg)}
button.g,button.x,nav button,.seg button,.gear,#toast button,.warn .row button,.nb,.stp button{box-shadow:none}
button:is(:active,.prs){transform:scale(.93);filter:brightness(.95);transition-duration:.08s}
button:disabled{opacity:.4}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.seg.qm button{border-radius:999px;padding:9px 6px}.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 auto;white-space:nowrap;padding:9px 12px}.seg.qm button.on{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent)}

/* ===== Header & bottom nav ===== */
.top{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--tx);border-bottom:1px solid var(--bd);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-top:calc(-1 * env(safe-area-inset-top,0px));font:600 20px/1.2 var(--fd);letter-spacing:-.2px;text-align:center}
.top .tt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 44px;white-space:nowrap}.top .logo{flex:none;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.jz{background:linear-gradient(90deg,#2f8fff,#38b6ff 55%,#7fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.gear{position:absolute;right:10px;bottom:7px;background:none;color:var(--mu);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}.gear.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bd);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 0;min-width:0;background:none;color:var(--mu);border-radius:16px;padding:7px 0 5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;z-index:1;transition:color .25s}
nav button>span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
nav button.on{color:var(--tc)}nav button:is(:active,.prs){transform:none;filter:none}
.ni{flex:none;width:24px;height:24px}
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:16px;width:var(--hw,0);height:var(--hh,0);transform:translate3d(var(--hx,0),var(--hy,0),0);background:color-mix(in srgb,var(--hc,#2f8fff) 14%,transparent);opacity:var(--ho,0);transition:transform .34s var(--bounce),width .34s var(--bounce),opacity .2s,background .25s}
nav.drag .hl{transition:none}
#peek{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
#peek>.view{max-width:1100px;margin:0 auto;padding:12px}

/* ===== Toast & popup ===== */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--tst);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:none;color:#7fd3ff;padding:6px 10px;font-weight:800}
#dlg{position:fixed;inset:0;z-index:35;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(8,16,28,.45);animation:dfade .18s ease-out}
#dlg[hidden]{display:none}
.dbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dup .28s cubic-bezier(.16,1,.3,1)}
.dbox h3{margin:0 0 6px;font:600 20px/1.2 var(--fd);color:var(--tx)}.dbox p{margin:0 0 14px;font-size:14px}.dbox textarea{margin-bottom:14px}
.dbtns{display:flex;flex-direction:column;gap:8px}.dbtns button{width:100%;padding:12px 16px}
@media(min-width:600px){#dlg{place-items:center}}
@keyframes dfade{from{opacity:0}}@keyframes dup{from{transform:translateY(28px);opacity:0}}

/* ===== Today ===== */
.view>.hello{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 4px -2px}
.hello b{font:600 25px/1.2 var(--fd)}.hello span{flex:none;font-size:13px;font-weight:800;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);padding:5px 12px;border-radius:99px}
.pcb{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--pc) 70%,transparent)}
.pcb:before,.pcb:after{content:"";position:absolute;border-radius:50%;background:#ffffff1c;pointer-events:none}.pcb:before{left:-50px;bottom:-80px;width:180px;height:180px}.pcb:after{right:-40px;top:-60px;width:140px;height:140px;background:#ffffff14}.pcb>*{position:relative;z-index:1}
.pcb>div{flex:1;min-width:0}.pcb b{display:block;font:600 22px/1.2 var(--fd)}.pcb span{font-size:13px;opacity:.92}
.pcb button{flex:none;background:#fff;color:var(--pc);box-shadow:0 6px 14px -6px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px 16px;background:var(--card);border:1px solid var(--bd)}.tile .mu{font-size:12px;font-weight:700}.tile b{display:block;font:600 28px/1.15 var(--fd);margin-top:2px;color:var(--pc)}
.flr{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--tx);box-shadow:none;border-radius:0;padding:11px 2px;text-align:left;font-weight:600}
.flr+.flr{border-top:1px solid var(--bd)}.flr:is(:active,.prs){transform:none;filter:none;background:var(--fld)}
.flr>span{flex:1;min-width:0}.flr .bar{margin-top:6px}.flr>b{flex:none;font-weight:700;font-size:14px}.flr>i{font-style:normal;color:var(--mu)}
.allok{display:flex;align-items:center;gap:10px;color:var(--ac);font-weight:700}

/* ===== Rounds ===== */
.view>.flh{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px -2px;scroll-margin-top:80px}
.flh h2{margin:0;color:var(--tx)}.flh span{font-weight:800;font-size:13px;color:var(--mu)}
.area{padding:0}.view>.area{padding-top:5px}
.area>summary{display:flex;align-items:center;gap:12px;padding:14px 16px}
.area>summary>div{flex:1;min-width:0}.area>summary b{display:block;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.area>summary .bar{margin-top:7px;height:6px}
.area>summary>em{flex:none;font-style:normal;font-weight:800;font-size:13px;color:var(--mu)}
.area.done>summary>em{color:var(--ac)}
.chev{flex:none;color:var(--mu);transition:transform .2s}.area[open] .chev{transform:rotate(90deg)}
.tasks{padding:0 16px 12px;border-top:1px solid var(--bd)}
.task{display:flex;align-items:center;gap:12px;padding:9px 0;min-height:48px}.task+.task,.task+.nt+.task{border-top:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
.task label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.task label span{flex:1;min-width:0;font-weight:600}
.task:has(input:checked) label span{opacity:.5;text-decoration:line-through}
.tm{flex:none;font-size:12px;font-weight:700;color:var(--mu)}
.nb{flex:none;background:none;color:var(--mu);width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px}.nb.has{color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.nt{margin:-4px 0 8px 38px;font-size:13px;color:var(--tx);background:var(--fld);border-radius:10px;padding:6px 10px}
.aall{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:6px}.aall button{padding:7px 14px;font-size:13px}.aall button.g:not(.bd){margin-right:auto;padding:7px 4px}
.aall:empty{display:none}

/* ===== Area notes and one-time tasks ===== */
.anote{display:flex;align-items:flex-start;gap:10px;width:100%;margin:12px 0 4px;background:color-mix(in srgb,var(--pc) 9%,var(--card));color:var(--tx);border:1px solid color-mix(in srgb,var(--pc) 22%,transparent);border-radius:12px;padding:9px 12px;box-shadow:none;text-align:left;font-weight:600;font-size:14px;white-space:pre-wrap}
.anote svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--pc)}.anote span{flex:1;min-width:0}.anote:is(:active,.prs){transform:none;filter:brightness(.97)}
textarea.anotein{height:72px}
.jobs .row{min-height:44px}.jobs .row+.row,.jobs .nt+.row{border-top:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}.jobs .nt{margin:-2px 0 8px 32px}
.jobs .row:has(>input[type=checkbox]:checked)>input[type=text]{opacity:.5;text-decoration:line-through}

/* ===== Sub areas ===== */
.sub{padding-top:10px}.sub+.sub{margin-top:6px;border-top:1px solid var(--bd)}
.subh{display:flex;align-items:center;gap:8px;min-height:32px}.subh b{flex:1;min-width:0;font-weight:800;font-size:14px;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subh>span{flex:none;font-weight:800;font-size:12px;color:var(--mu)}.subh>span.pos{color:var(--ac)}.subh button{flex:none;padding:5px 10px;font-size:12px}
.sub .anote{margin:6px 0 2px}.sub>.tbg{margin:2px 0 4px}

/* ===== Tours ===== */
.tbg{display:inline-flex;align-items:center;gap:5px;margin-top:7px;max-width:100%;font-size:12px;font-weight:800;color:var(--wn);background:color-mix(in srgb,var(--wn) 13%,transparent);border-radius:99px;padding:3px 9px}
.tbg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbg svg,.tb svg{flex:none}
.tours .lrow{align-items:center}.tours .lrow>.tm{line-height:1.25}.tours .lrow>div b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{position:absolute;z-index:2;transform:translate(calc(-100% - 3px),3px);display:flex;align-items:center;gap:3px;font-family:inherit;font-weight:800;font-size:9px;line-height:1;color:#3a2600;background:#ffd95e;border-radius:3px;padding:3px 5px;pointer-events:none;white-space:nowrap}
.dform{display:grid;gap:4px;margin-bottom:14px}.dform .sec{margin:8px 0 2px}.dform .dates{margin-top:4px}

/* ===== Log ===== */
.lrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}.lrow+.lrow{border-top:1px solid var(--bd)}
.lrow>.tm{width:66px;padding-top:2px}.lrow>div{flex:1;min-width:0}.lrow>div b{font-weight:700}.lrow>div .mu{display:block}
.lrow .nt{margin:6px 0 0}.lrow button.x{padding:2px 6px}
.rnd{font-size:13px;font-weight:700;color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,transparent);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.dates{display:flex;gap:8px;margin-top:10px}.dates label{flex:1}.dates input{margin-top:4px}

/* ===== Supplies ===== */
.sup>summary{display:flex;align-items:center;gap:10px;padding:8px 0}.sup+.sup{border-top:1px solid var(--bd)}
.sup>summary>div{flex:1;min-width:0}.sup>summary b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp{flex:none;display:flex;align-items:center;gap:4px}.stp button{width:34px;height:34px;padding:0;border-radius:50%;background:var(--fld);color:var(--tx);font-size:18px;font-weight:700;display:grid;place-items:center}
.stp b{min-width:36px;text-align:center;font:600 18px var(--fd)}.stp b.lw{color:var(--neg)}
.sbody{padding:4px 0 12px}.sbody label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:8px}.sbody label input{margin-top:3px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g3 input[type=number]{width:100%;text-align:left}

/* ===== Setup ===== */
.arow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;color:var(--tx);box-shadow:none;padding:8px 2px;text-align:left;font-weight:600;border-radius:10px}
.arow:is(:active,.prs){transform:none;filter:none;background:var(--fld)}.arow>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow>.mu{flex:none}
.chk{display:flex;align-items:center;gap:12px;padding:6px 0;cursor:pointer;font-weight:600}
.view>.lback{justify-self:start;grid-column:1/-1}
.dh{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:34px;margin-left:-6px;color:var(--mu);opacity:.45;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dragging{position:relative;z-index:20;background:var(--card);border-radius:10px;box-shadow:0 10px 24px rgba(16,24,40,.18),0 0 0 1px var(--bd)}.dragging .dh{opacity:1;color:var(--pc)}
body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}

<script>

// 1. CONSTANTS
// =====================================================================
const LS='cleaning-v1';                    // localStorage key (don't change: it holds your data)

// =====================================================================

// =====================================================================

// A brand-new install starts with the building from the notebook pages
function seed(){

 const RR=['Clean toilets and urinals','Clean sinks and mirrors','Restock paper and soap','Empty trash'];
 const areas=[
  A('Trash room','Floor 1',['Empty and change bins','Wipe down bins and walls'],['Windows and door glass']),
  A('101-108 hall','Floor 1'),A('109-117 hall','Floor 1'),
  A('Office hallway and 4 offices','Floor 2',['Check trash']),
  A('Community room','Floor 2'),
  A('Lobby and vestibule','Floor 2'),
  A('Fitness center','Floor 2',['Wipe down equipment','Empty trash']),
  A('Restroom 1','Floor 2',RR),A('Restroom 2','Floor 2',RR),
  A('201-206 hall','Floor 2'),A('207-213 hall','Floor 2'),
  A('301-308 hall','Floor 3'),A('309-317 hall','Floor 3'),A('Study lounge','Floor 3'),
  A('401-408 hall','Floor 4'),A('409-417 hall','Floor 4'),A('Study lounge','Floor 4'),

 const sup=['Gloves','All-purpose cleaner','Window cleaner','Floor cleaner','Paper towels','Microfiber cloths','Feather duster','Toilet bowl cleaner','Magic erasers','Microfiber cloths for windows','Trash bags','Disinfectant spray','Mop heads','Dust mop heads']
  .map(n=>({id:uid('s'),n,q:null,u:'',low:null,w:''}));

 return {v:MIGRATIONS.length,set:{theme:'system',welcome:1,since:Date.now(),who:'',keep:6,prop:prop.id},props:[prop],log:[],rounds:[],cur:null}}

// Schema migrations. S.v records how many have run. To change the data shape later,
// ADD a new function to the end of this list; never edit an old one.
const MIGRATIONS=[
 // v1: first version
 S=>{S.set=S.set||{};if(!S.set.theme)S.set.theme='system';if(!S.set.since)S.set.since=Date.now();if(!S.set.keep)S.set.keep=6;
  ['floors','std','areas','log','rounds','sup'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(S.cur===undefined)S.cur=null},

 S=>{if(!Array.isArray(S.props)){const id=uid('p');S.props=[{id,n:(S.set.site||'').trim()||'Main building',floors:S.floors||[],std:S.std||[],areas:S.areas||[],sup:S.sup||[]}];

];

// The property you're looking at, and its data path ('props.0')

// ---- Floor map: a pegboard 12 pegs across and 18 down. Each area is a shape on it: a rectangle
//      {x, y, w, h} in pegs, optionally with one corner cut out to make an L ({cut: {c: 'tl'|'tr'|'bl'|'br', w, h}}). ----
const COLS=12,ROWS=18,PEG=10;            // PEG: drawing units per peg in the SVG
const defSize=n=>/hall|sidewalk|walkway|corridor/i.test(n)?[12,2]:/stair|elevator/i.test(n)?[4,2]:[4,3];
// The rectangles that make up a shape (one, or two for an L)
function rectsOf(L){if(!L.cut)return [L];const {x,y,w,h}=L,cw=L.cut.w,ch=L.cut.h;
 return {tl:[{x:x+cw,y,w:w-cw,h:ch},{x,y:y+ch,w,h:h-ch}],tr:[{x,y,w:w-cw,h:ch},{x,y:y+ch,w,h:h-ch}],
  bl:[{x,y,w,h:h-ch},{x:x+cw,y:y+h-ch,w:w-cw,h:ch}],br:[{x,y,w,h:h-ch},{x,y:y+h-ch,w:w-cw,h:ch}]}[L.cut.c]}
// Outline points, clockwise from the top-left
function polyOf(L){const {x,y,w,h}=L;if(!L.cut)return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];const cw=L.cut.w,ch=L.cut.h;
 return {tl:[[x+cw,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y+ch],[x+cw,y+ch]],tr:[[x,y],[x+w-cw,y],[x+w-cw,y+ch],[x+w,y+ch],[x+w,y+h],[x,y+h]],
  br:[[x,y],[x+w,y],[x+w,y+h-ch],[x+w-cw,y+h-ch],[x+w-cw,y+h],[x,y+h]],bl:[[x,y],[x+w,y],[x+w,y+h],[x+cw,y+h],[x+cw,y+h-ch],[x,y+h-ch]]}[L.cut.c]}
// Where the inside corner of an L sits (its handle)
function notchOf(L){const {x,y,w,h}=L,cw=L.cut.w,ch=L.cut.h;return {tl:[x+cw,y+ch],tr:[x+w-cw,y+ch],br:[x+w-cw,y+h-ch],bl:[x+cw,y+h-ch]}[L.cut.c]}
const bigRect=L=>rectsOf(L).reduce((m,r)=>r.w*r.h>m.w*m.h?r:m);
const fits=L=>L.x>=0&&L.y>=0&&L.w>=1&&L.h>=1&&L.x+L.w<=COLS&&L.y+L.h<=ROWS&&(!L.cut||(L.cut.w>=1&&L.cut.h>=1&&L.cut.w<L.w&&L.cut.h<L.h));
const hit=(A,B)=>rectsOf(A).some(a=>rectsOf(B).some(b=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h));
// A shape can go somewhere if it's on the board and doesn't cover another area on the same floor
function spotFree(prop,a,L){return fits(L)&&!prop.areas.some(b=>b!==a&&b.fl==a.fl&&b.lay&&hit(L,b.lay))}
// Dropping room a (which started at A0) at L, on top of another room: find a way to trade places.
// a takes the other room's corner (or the spot where it was dropped) and the other room moves to a's old corner.
function trySwap(prop,a,A0,L){const others=prop.areas.filter(b=>b!==a&&b.fl==a.fl&&b.lay&&hit(L,b.lay));if(!others.length)return null;
 const area=(P,Q)=>{let n=0;rectsOf(P).forEach(p=>rectsOf(Q).forEach(q=>{const w=Math.min(p.x+p.w,q.x+q.w)-Math.max(p.x,q.x),h=Math.min(p.y+p.h,q.y+q.h)-Math.max(p.y,q.y);if(w>0&&h>0)n+=w*h}));return n};
 const b=others.reduce((m,o)=>area(L,o.lay)>area(L,m.lay)?o:m),B0=b.lay;
 const ok=(AL,BL)=>fits(AL)&&fits(BL)&&!hit(AL,BL)&&!prop.areas.some(o=>o!==a&&o!==b&&o.fl==a.fl&&o.lay&&(hit(AL,o.lay)||hit(BL,o.lay)));
 const mv=(X,x,y)=>({...JSON.parse(JSON.stringify(X)),x,y});
 const tries=[[mv(A0,B0.x,B0.y),mv(B0,A0.x,A0.y)],[L,mv(B0,A0.x,A0.y)],
  [mv(A0,B0.x+B0.w-A0.w,B0.y),mv(B0,A0.x+A0.w-B0.w,A0.y)],[mv(A0,B0.x,B0.y+B0.h-A0.h),mv(B0,A0.x,A0.y+A0.h-B0.h)]];
 for(const [AL,BL] of tries)if(ok(AL,BL))return {b:b.id,AL,BL};return null}
// ---- Room colors: every room on a floor gets its own color, and rooms that touch never share one.
//      Worked out from the layout each time the map is drawn, so it updates by itself after any edit. ----
const RCOL=['#8fdcff','#7ef0c0','#ffd95e','#ff9f8a','#c9a7ff','#ff9fd2','#c6f26b','#ffb85c','#7fb2ff','#5ee0e6'];
const touch=(A,B)=>rectsOf(A).some(a=>rectsOf(B).some(b=>a.x<=b.x+b.w&&b.x<=a.x+a.w&&a.y<=b.y+b.h&&b.y<=a.y+a.h&&!((a.x+a.w==b.x||b.x+b.w==a.x)&&(a.y+a.h==b.y||b.y+b.h==a.y))));
function roomColors(as){const col=new Map(),used=RCOL.map(()=>0);
 as.filter(a=>a.lay).forEach(a=>{const near=new Set(as.filter(b=>b!==a&&b.lay&&col.has(b.id)&&touch(a.lay,b.lay)).map(b=>col.get(b.id)));
  let best=-1;RCOL.forEach((_,k)=>{if(near.has(k))return;if(best<0||used[k]<used[best])best=k});if(best<0)best=0;col.set(a.id,best);used[best]++});
 const m=new Map();col.forEach((k,id)=>m.set(id,RCOL[k]));return m}
// Put an area in the first free spot on its floor, top to bottom, left to right (shrinking it if the floor is full)
function place(prop,a){const want=a.lay?[a.lay.w,a.lay.h]:defSize(a.n||''),cutW=a.lay&&a.lay.cut;a.lay=null;
 for(const [w,h,c] of [[...want,cutW],[...want],[4,2],[2,2],[2,1]])for(let y=0;y+h<=ROWS;y++)for(let x=0;x+w<=COLS;x++){const L={x,y,w,h};if(c)L.cut={...c};if(spotFree(prop,a,L)){a.lay=L;return}}
 a.lay={x:0,y:0,w:2,h:1}}
const floorOf=a=>P().floors.find(f=>f.id==a.fl);
// ---- Sub areas: an area can be split into parts (a hallway and each office), each with its own checklist.
//      A sub area is an area with par = its parent's id. It has no spot on the map; its parent stands for it there. ----
const kids=a=>P().areas.filter(x=>x.par==a.id);
const leaf=a=>{const k=kids(a);return k.length?k:[a]};             // the areas that actually hold tasks
// The tasks an area gets: the standard set (minus any turned off there), then its own extras.
// An area split into sub areas has none of its own; its sub areas carry them.
const tasksOf=a=>kids(a).length?[]:(a.useStd?P().std.filter(t=>!a.skip.includes(t.id)):[]).concat(a.ex);
const areasOn=f=>P().areas.filter(a=>a.fl==f.id&&!a.par);       // top-level areas on a floor, in order
function buildIndex(){const m=new Map();for(const e of S.log){const k=e.a+'|'+e.t,p=m.get(k);if(!p||e.at>p.at)m.set(k,e)}LI=m}
const lastOf=(a,t)=>LI.get(a.id+'|'+t.id);
const entry=(a,t)=>({id:uid('e'),a:a.id,t:t.id,p:P().id,at:Date.now(),...(curHere()?{r:S.cur.id}:{})});
// When a task done on `last` comes due again
function nextDue(f,last){const d=dOf(last.at);return f=='daily'||f=='round'?addDays(d,1):f=='weekly'?addDays(d,7):f=='monthly'?addMonths(d,1):null}
function isDue(f,last){if(f=='need')return false;if(!last)return true;
 if(f=='round')return curHere()?last.at<S.cur.s:dOf(last.at)<tdy();
 return tdy()>=nextDue(f,last)}
// State of one task in one area right now
function st(a,t){const last=lastOf(a,t),due=isDue(t.f,last),today=!!last&&dOf(last.at)==tdy();
 return {last,due,today,done:t.f=='need'?today:!due&&!!last}}
// Progress for a set of areas: tasks done today vs. still due (as-needed tasks don't count)
// (an area split into sub areas counts its sub areas' tasks)
function prog(areas){let due=0,done=0;new Set(areas.flatMap(leaf)).forEach(a=>tasksOf(a).forEach(t=>{if(t.f=='need')return;const s=st(a,t);if(s.due)due++;else if(s.today)done++}));return {due,done,tot:due+done}}
// Weekly and monthly tasks that came due before today
function overdue(){const L=[],t0=tdy();P().areas.forEach(a=>tasksOf(a).forEach(t=>{if(t.f!='weekly'&&t.f!='monthly')return;const l=lastOf(a,t);if(!l)return;const nd=nextDue(t.f,l);if(nd<t0)L.push({a,t,l,nd})}));return L.sort((x,y)=>x.nd<y.nd?-1:1)}
// ---- Tours: someone is being shown a unit or space at a set time. The area gets a badge so you can steer clear or have it ready. ----
const tmS=t=>t?tm(new Date('2000-01-01T'+t)):'';                  // '12:30' -> "12:30 PM"
const areaName=a=>{const p=a.par&&areaById(a.par);return (p?(p.n||'Untitled')+' › ':'')+(a.n||'Untitled')};   // "Office hallway › Office 1"
const tourKey=x=>x.d+(x.t||'99');                                  // tours with no time sort last in their day
// strict: only tours for this exact area; otherwise its sub areas' tours count too
const toursToday=(a,strict)=>P().tours.filter(x=>x.d==tdy()&&(x.a==a.id||(!strict&&kids(a).some(k=>k.id==x.a)))).sort((p,q)=>tourKey(p)<tourKey(q)?-1:1);
const tourTxt=x=>'Tour'+(x.t?' '+tmS(x.t):'')+(x.n?' · '+x.n:'');
const isLow=s=>s.low!=null&&s.q!=null&&s.q<=s.low;
// Names for a log entry (falls back to the names saved when an area or task was deleted)
const eArea=e=>{const a=areaById(e.a);return a?areaName(a):e.an||'Deleted area'};
const eFloor=e=>{const a=areaById(e.a),f=a&&floorOf(a);return f?f.n:e.fn||''};
const eTask=e=>{if(!e.a){const j=P().jobs.find(x=>x.id==e.t);if(j&&j.n)return j.n}const a=areaById(e.a),t=(a?a.ex:[]).concat(P().std).find(x=>x.id==e.t);return t?t.n:e.tn||'Deleted task'};
// Before deleting, write the names into the history so old entries still read correctly
function snap(pred){S.log.forEach(e=>{if(pred(e)){e.an=eArea(e);e.tn=eTask(e);e.fn=eFloor(e)}})}
function logRange(){const t=tdy();
 if(LR=='today')return [t,t];if(LR=='yest'){const y=addDays(t,-1);return [y,y]}
 if(LR=='7')return [addDays(t,-6),t];if(LR=='30')return [addDays(t,-29),t];
 const a=LF||addDays(t,-6),b=LT||t;return a<=b?[a,b]:[b,a]}
const inRange=([a,b])=>S.log.filter(e=>{const d=dOf(e.at);return e.p==P().id&&d>=a&&d<=b}).sort((x,y)=>x.at-y.at);
const roundsIn=([a,b])=>S.rounds.filter(r=>{const d=dOf(r.s);return r.p==P().id&&d>=a&&d<=b}).sort((x,y)=>x.s-y.s);

// 6. SHARED UI PIECES
// =====================================================================
const ICX='<svg class="ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ICK='<svg class="ic" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICN='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const CLK='<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.6V8l2.3 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const DH=`<span class="dh" title="Drag to reorder"><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><g fill="currentColor"><circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></g></svg></span>`;
// Inputs bound to a data path save themselves on change
const I=(p,ph='',t='text')=>{const v=get(p),q=t=='qty';
 return `<input type="${q?'number':'text'}" ${q?'inputmode="decimal" step="any" min="0"':''} placeholder="${esc(ph)}" value="${esc(v??'')}" data-p="${p}" data-t="${q?'q':'s'}">`};
const SEL=(p,list,cls='')=>`<select class="${cls}" data-p="${p}" data-t="s">${list.map(([v,l])=>`<option value="${esc(v)}" ${get(p)==v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const bar=(n,d)=>`<div class="bar"><i style="width:${d?Math.round(n/d*100):0}%"></i></div>`;
const flash=()=>FL?`<div class="mu pos" style="margin-top:6px">${esc(FL)}</div>`:'';
function hello(){const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening',w=(S.set.who||'').trim();
 return `<div class="hello"><b>${g}${w?', '+esc(w):''}</b><span>${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span></div>`}
// Which property you're on; tap to switch or add one
const CHD='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const propBar=()=>`<div class="pbar"><button data-a="props"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg><span>${esc(P().n||'Untitled property')}</span>${S.props.length>1?CHD:'<em>+</em>'}</button></div>`;
// The round card at the top of Today and Rounds
function roundCard(){const p=prog(P().areas);
 if(S.cur&&!curHere()){const o=S.props.find(p=>p.id==S.cur.p);
  return `<div class="pcb"><div><b>Round running elsewhere</b><span>Started ${tm(S.cur.s)} at ${esc(o?o.n:'another property')}</span></div><button data-a="endRound">Finish</button></div>`}
 if(S.cur){const n=S.log.filter(e=>e.r==S.cur.id).length;
  return `<div class="pcb"><div><b>Round in progress</b><span>Started ${tm(S.cur.s)} · ${plural(n,'task')} checked</span></div><button data-a="endRound">Finish</button></div>`}
 const last=S.rounds[S.rounds.length-1],lt=last&&dOf(last.s)==tdy()?` · Last round ${tm(last.s)} to ${tm(last.e)}`:'';
 return `<div class="pcb"><div><b>${p.due?'Ready for a round?':'All caught up'}</b><span>${p.due?plural(p.due,'task')+' due':'Nothing due right now'}${lt}</span></div><button data-a="startRound">Start round</button></div>`}
// One-time tasks: things you were asked to do once that aren't tied to an area. They stay until checked off,
// then show crossed out for the rest of that day. Checking one off writes it into the history like any task.
// Tours today and coming up, soonest first
function tourCard(){const t=tdy(),xs=P().tours.filter(x=>x.d>=t).sort((p,q)=>tourKey(p)<tourKey(q)?-1:1);
 return `<div class="card tours"><h2>Tours</h2>${xs.map(x=>{const a=areaById(x.a),f=a&&floorOf(a);
   return `<div class="lrow"><span class="tm">${x.d==t?'':sd(x.d)+'<br>'}${x.t?tmS(x.t):'Any time'}</span><div><b>${esc(x.n||'Tour')}</b><span class="mu">${esc(a?areaName(a):'Deleted area')}${f?' · '+esc(f.n):''}</span></div><button class="nb" data-a="editTour" data-id="${x.id}" aria-label="Edit tour">${ICN}</button><button class="x" data-a="delTour" data-id="${x.id}" aria-label="Delete">${ICX}</button></div>`}).join('')||'<p class="mu" style="margin:0 0 4px">No tours coming up.</p>'}
  <div class="row" style="margin-top:8px"><button class="g bd" data-a="addTour">Add tour</button></div></div>`}
const jobsLeft=()=>P().jobs.filter(j=>!j.done).length;
function jobCard(){const js=P().jobs.map((j,i)=>[j,i]).filter(([j])=>!j.done||dOf(j.done)==tdy()),left=jobsLeft();
 return `<div class="card wide jobs"><h2>One-time tasks</h2>${js.map(([j,i])=>{const e=j.done&&S.log.find(x=>x.id==j.e),note=e&&e.note;
   return `<div class="row ed"><input type="checkbox" ${j.done?'checked':''} data-a="job" data-id="${j.id}">${I(`${PP()}.jobs.${i}.n`,'Task')}${j.done?`<span class="tm">${tm(j.done)}</span>${e?`<button class="nb${note?' has':''}" data-a="note" data-id="${e.id}" aria-label="Note">${ICN}</button>`:''}`:`<span class="tm">${sd(dOf(j.add))}</span>`}<button class="x" data-a="delJob" data-i="${i}" aria-label="Delete">${ICX}</button></div>${note?`<div class="nt">${esc(note)}</div>`:''}`}).join('')||'<p class="mu" style="margin:0 0 4px">Nothing extra right now. Add anything you’re asked to do that isn’t part of an area.</p>'}
  <div class="row" style="margin-top:8px"><input type="text" id="jn" placeholder="e.g. Move boxes out of the lobby" enterkeyhint="done"><button data-a="addJob">Add</button></div>${left?`<p class="mu" style="margin:6px 0 0">${plural(left,'task')} left</p>`:''}</div>`}

// ---- Today ----
function vToday(){const p=prog(P().areas),od=overdue(),low=P().sup.filter(isLow);
 const welcome=S.set.welcome?`<div class="card wide"><h3><span>Welcome to Big Shiny</span><button class="g" data-a="welcomeOff" aria-label="Dismiss">${ICX}</button></h3><p class="mu" style="margin:0 0 12px">Your building is loaded from your notes. The extra tasks for the restrooms, fitness center, elevators, trash room and sidewalks are starting guesses, so check them in Setup.</p><div class="row"><button data-a="tab" data-id="setup">Check Setup</button></div></div>`:'';
 const bk=needBk()?`<div class="card wide"><h3><span>Back up your rounds?</span></h3><p class="mu" style="margin:0 0 12px">Your history is only saved in this browser unless sync is on, and some browsers clear site data after a while.</p><div class="row"><button data-a="gear">Back up</button><button class="g bd" data-a="bkLater">Later</button></div></div>`:'';
 const odc=od.length?`<div class="card warn"><h3><span><i class="bang">!</i>Overdue</span><span>${od.length}</span></h3>${od.slice(0,8).map(x=>`<div class="row"><span style="flex:1;min-width:0"><b>${esc(x.t.n)}</b><span class="mu" style="display:block">${esc(areaName(x.a))} · last done ${sd(dOf(x.l.at))}</span></span><button data-a="tick1" data-ar="${x.a.id}" data-tk="${x.t.id}">Done</button></div>`).join('')}${od.length>8?`<div class="mu">and ${od.length-8} more on the Rounds tab</div>`:''}</div>`:'';
 const lowc=low.length?`<div class="card warn"><h3><span><i class="bang">!</i>Running low</span><span>${low.length}</span></h3>${low.map(s=>`<div class="ln"><span>${esc(s.n)}${s.w?` <span class="mu">· ${esc(s.w)}</span>`:''}</span><b class="neg">${s.q} ${esc(s.u)}</b></div>`).join('')}<div class="row" style="margin-top:6px"><button class="g bd" data-a="tab" data-id="sup">Supplies</button></div></div>`:'';
 const floors=P().floors.filter(f=>areasOn(f).length).map(f=>{const q=prog(areasOn(f));
  return `<button class="flr" data-a="goFloor" data-id="${f.id}"><span>${esc(f.n)}${bar(q.done,q.tot)}</span><b class="${q.tot&&!q.due?'pos':''}">${q.done}/${q.tot}</b><i>${CHEV}</i></button>`}).join('');
 return hello()+propBar()+welcome+bk+roundCard()
  +`<div class="tiles"><div class="tile"><span class="mu">Done today</span><b>${p.done}</b></div><div class="tile"><span class="mu">Still due</span><b>${p.due}</b></div></div>`
  +odc+tourCard()+jobCard()+lowc+`<div class="card"><h2>Floors</h2>${floors||'<p class="mu">No areas yet. Add them in Setup.</p>'}</div>`}

// ---- Rounds: walk the building and check tasks off ----
// Due now / All tasks / Map / By floor
const viewSeg=()=>`<div class="seg qm wrap">${[['due','Due now'],['all','All tasks'],['map','Map'],['floor','By floor']].map(([v,l])=>`<button class="${(FV?'floor':VIEW)==v?'on':''}" data-a="view" data-v="${v}">${l}</button>`).join('')}</div>`;
const mapFloors=()=>P().floors.filter(f=>areasOn(f).length);
function vRounds(){
 if(FV){const f=P().floors.find(x=>x.id==FV);if(f)return vFloor(f);FV=null}
 let h=propBar()+roundCard()+viewSeg();
 if(VIEW=='map')return h+vMap();
 if(VIEW=='all'||jobsLeft())h+=jobCard();
 let any=false;
 P().floors.forEach(f=>{const as=areasOn(f);if(!as.length)return;const q=prog(as);
  const cards=as.map(a=>areaCard(a)).filter(Boolean).join('');if(!cards)return;any=true;
  h+=`<div class="flh" id="fl-${f.id}"><h2>${esc(f.n)}</h2><span>${q.done}/${q.tot} done</span></div>`+cards});
 if(!any)h+=`<div class="card wide"><div class="allok">${ICK} Everything is done for now.</div><p class="mu" style="margin:6px 0 0">Switch to All tasks to see everything, including as-needed tasks.</p></div>`;
 return h}
// The checklist rows for one area or sub area
